name: flutter_chat_app
description: A production-ready Flutter companion app for Persian Chat Application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.0
  google_fonts: ^5.1.0
  intl: ^0.19.0
  flutter_local_notifications: 17.2.0
  record: 6.0.0
  audioplayers: 6.0.0
  file_picker: ^8.0.0
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  dio: ^5.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
